# Staging FTP account must be rooted directly in the staginghome directory.
# Needs repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (see README "Deploy").
name: Deploy staging to cPanel

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # optional repository variable; without it the site shows sample rates
          VITE_RATES_URL: ${{ vars.VITE_RATES_URL }}

      - name: Upload dist/ to staging FTP root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # The FTP account already points at staginghome; do not append public_html.
          server-dir: ./
