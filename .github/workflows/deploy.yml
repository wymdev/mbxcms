# Build the site and upload dist/ to cPanel over FTP on every push to main.
# Needs repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (see README "Deploy").
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # optional repository variable; without it the site shows sample rates
          VITE_RATES_URL: ${{ vars.VITE_RATES_URL }}

      - name: Upload dist/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # main cPanel account: /public_html/ — an FTP account created for public_html: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
